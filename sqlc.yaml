version: "2"
sql: 
  - engine: "sqlite"
    queries: ["/internal/db/users/query.sql"]
    schema: ["/internal/db/users/schema.sql"]
    gen:
      go:
        package: "users"
        out: "/internal/db/users/"
  - engine: "sqlite"
    queries: ["/internal/db/posts/query.sql"]
    schema: ["/internal/db/posts/schema.sql", "/internal/db/users/schema.sql"]
    gen:
      go:
        package: "posts"
        out: "/internal/db/posts/"
  - engine: "sqlite"
    queries: ["/internal/db/comments/query.sql"]
    schema: ["/internal/db/comments/schema.sql", "/internal/db/users/schema.sql"]
    gen:
      go:
        package: "comments"
        out: "/internal/db/comments/"
  - engine: "sqlite"
    queries: ["/internal/db/session/query.sql"]
    schema: ["/internal/db/session/schema.sql"]
    gen:
      go:
        package: "sessionDB"
        out: "/internal/db/session/"
  - engine: "sqlite"
    queries: ["/internal/db/messages/query.sql"]
    schema: ["/internal/db/messages/schema.sql", "/internal/db/users/schema.sql"]
    gen:
      go:
        package: "messages"
        out: "/internal/db/messages/"